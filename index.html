<!DOCTYPE html>
<html>
<head>
    <title>Predictive Maintenance</title>
</head>

<body>

    <h1>Predictive Maintenance</h1>
    <p>Enter machine operating conditions to predict failure risk.</p>

    <form id="predictionForm">

        <label>Machine Type:</label>
        <select id="Type">
            <option value="L">L</option>
            <option value="M">M</option>
            <option value="H">H</option>
        </select>
        <br><br>

        <label>Air Temperature [K]:</label>
        <input type="number" id="air_temp" step="0.1" required>
        <br><br>

        <label>Process Temperature [K]:</label>
        <input type="number" id="process_temp" step="0.1" required>
        <br><br>

        <label>Rotational Speed [rpm]:</label>
        <input type="number" id="rpm" required>
        <br><br>

        <label>Torque [Nm]:</label>
        <input type="number" id="torque" step="0.1" required>
        <br><br>

        <label>Tool Wear [min]:</label>
        <input type="number" id="tool_wear" required>
        <br><br>

        <button type="submit">Predict Failure</button>

    </form>

    <h2 id="result"></h2>

    <script>

        document.getElementById("predictionForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const data = {
                "Type": document.getElementById("Type").value,
                "Air temperature [K]": Number(document.getElementById("air_temp").value),
                "Process temperature [K]": Number(document.getElementById("process_temp").value),
                "Rotational speed [rpm]": Number(document.getElementById("rpm").value),
                "Torque [Nm]": Number(document.getElementById("torque").value),
                "Tool wear [min]": Number(document.getElementById("tool_wear").value)
            };

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById("result").innerHTML =
                "Failure Probability: " + (result.failure_probability * 100).toFixed(2) +
                "%<br>Prediction: " + result.prediction;

        });

    </script>

</body>
</html>
